name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: JavaScript checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - run: make check

  package:
    name: Build, package, and test with core
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LNBITS_CORE_PATH: ${{ github.workspace }}/.ci/lnbits
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Check versions and release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const [config, pkg, lock] = ['config.json', 'package.json', 'package-lock.json']
            .map(file => JSON.parse(readFileSync(file, 'utf8')));
          for (const version of [pkg.version, lock.version, lock.packages[''].version]) {
            assert.equal(version, config.version, 'Package versions must match config.json');
          }
          if (process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG, `v${config.version}`);
          JS

      - name: Install locked dependencies
        run: npm ci

      - name: Build WASM, UI, and installable ZIP
        # The check job already ran the source checks and unit tests.
        run: make package -o check

      - name: Check committed browser assets are current
        run: git diff --exit-code -- static/app.js static/app.css THIRD_PARTY_NOTICES.txt

      - name: Checkout compatible LNbits core
        uses: actions/checkout@v7
        with:
          repository: lnbits/lnbits
          # Includes reserve_address_public and on-chain status bigint bindings.
          ref: 4cfe9e6e471e71a3087b74d1c776b74054b4822a
          path: .ci/lnbits
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.12'
          working-directory: .ci/lnbits
          cache-dependency-glob: uv.lock

      - name: Install locked core dependencies
        working-directory: .ci/lnbits
        run: uv sync --locked --no-dev

      - name: Check core Vue and Quasar startup
        run: make test-ui

      - name: Test the installable ZIP against core
        env:
          POS_ARTIFACT_ROOT: ${{ runner.temp }}/pos-package/pos
        run: |
          unzip -q dist/pos-*.zip -d "$RUNNER_TEMP/pos-package"
          make test-host PYTHON="$LNBITS_CORE_PATH/.venv/bin/python"

      - name: Checksum package
        working-directory: dist
        run: sha256sum pos-*.zip > SHA256SUMS

      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: pos-package
          path: |
            dist/pos-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'lnbits/pos'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pos-package
          path: dist

      - name: Publish tested ZIP and checksum
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            pos-*.zip SHA256SUMS

  registry:
    name: Open WASM registry PR
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'lnbits/pos'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REGISTRY_BRANCH: update-pos-${{ github.ref_name }}
    steps:
      - name: Check registry token
        env:
          EXT_GITHUB: ${{ secrets.EXT_GITHUB }}
        run: |
          if [ -z "$EXT_GITHUB" ]; then
            echo '::error::EXT_GITHUB must allow branch pushes and pull requests in lnbits/lnbits-extensions-wasm.'
            exit 1
          fi

      - name: Checkout WASM registry
        uses: actions/checkout@v7
        with:
          repository: lnbits/lnbits-extensions-wasm
          ref: main
          token: ${{ secrets.EXT_GITHUB }}
          fetch-depth: 0

      - name: Download published release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "pos-${RELEASE_TAG#v}.zip" \
            --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/pos-published-release"

      - name: Prepare registry branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$REGISTRY_BRANCH" > /dev/null; then
            git fetch origin "$REGISTRY_BRANCH"
            git checkout -b "$REGISTRY_BRANCH" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b "$REGISTRY_BRANCH"
          fi

      - name: Validate published ZIP and update registry entry
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from zipfile import ZipFile

          import update_version

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise ValueError('Expected a stable vX.Y.Z release tag')
          version = tag[1:]
          release_dir = Path(os.environ['RUNNER_TEMP']) / 'pos-published-release'
          archive = release_dir / f'pos-{version}.zip'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksums = (release_dir / 'SHA256SUMS').read_text().splitlines()
          if checksums != [f'{digest}  {archive.name}']:
              raise ValueError('Published ZIP does not match SHA256SUMS')
          with ZipFile(archive) as package:
              root, config_name = update_version.validate_wasm_archive_layout(package)
              config = json.loads(package.read(config_name))
              update_version.validate_wasm_config('pos', tag, version, package, root, config)

          manifest = json.loads(Path('extensions.json').read_text())
          for entry in manifest.get('extensions', []):
              if entry['id'] == 'pos' and tuple(map(int, entry['version'].split('.'))) > tuple(map(int, version.split('.'))):
                  raise ValueError('Registry already contains a newer PoS release')
          # PoS uses /pos/static/... for its tile; the registry needs a repo path.
          if config.get('tile', '').startswith('/pos/'):
              config['tile'] = config['tile'][len('/pos/'):]
          repo = 'https://github.com/lnbits/pos'
          update_version.update_manifest(
              'pos', tag, version, repo,
              f'{repo}/releases/download/{tag}/{archive.name}', digest, config,
          )
          PY

      - name: Open or reuse registry PR
        env:
          GH_TOKEN: ${{ secrets.EXT_GITHUB }}
        run: |
          git add extensions.json
          if ! git diff --cached --quiet; then
            git commit -m "[UPDATE] pos to $RELEASE_TAG"
            git push origin "$REGISTRY_BRANCH"
          fi
          if git diff --quiet origin/main HEAD -- extensions.json; then
            echo 'Registry already contains this release.'
            exit 0
          fi
          existing=$(gh pr list --repo lnbits/lnbits-extensions-wasm \
            --head "$REGISTRY_BRANCH" --state open --json number --jq 'length')
          if [ "$existing" = '0' ]; then
            gh pr create --repo lnbits/lnbits-extensions-wasm \
              --title "[UPDATE] pos to $RELEASE_TAG" \
              --body "Automated PoS registry update using the verified runtime ZIP and SHA-256 checksum published at https://github.com/lnbits/pos/releases/tag/$RELEASE_TAG." \
              --head "$REGISTRY_BRANCH" --base main
          fi
